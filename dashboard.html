<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – KCST GST Learn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9;
      color: #111827;
      font-size: 14px;
      line-height: 1.5;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* main card */
    .dashboard-card {
      max-width: 920px;
      width: 100%;
      background: #ffffff;
      border-radius: 8px;
      padding: 22px 20px 18px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* header row: Dashboard + English */
    .dashboard-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 6px;
    }
    .dashboard-head h2 {
      font-size: 20px;
      font-weight: 600;
      color: #0b1e33;
      letter-spacing: -0.2px;
    }
    .lang-badge {
      background: #eef2f6;
      padding: 4px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      color: #1e293b;
      border: 1px solid #dce1e8;
      letter-spacing: 0.2px;
    }

    /* "My Saved Applications" – below Dashboard */
    .saved-applications-label {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 14px;
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    /* table wrapper */
    .table-wrap {
      overflow-x: auto;
      margin: 0 -2px;
    }

    /* table with borders */
    .dash-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 700px;
      border: 1px solid #dce1e8;
      border-radius: 6px;
      overflow: hidden;
    }

    .dash-table th,
    .dash-table td {
      padding: 12px 14px;
      border: 1px solid #dce1e8;
      text-align: left;
      vertical-align: middle;
      background: #ffffff;
    }

    /* header background */
    .dash-table th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border-bottom: 2px solid #d0d7e0;
    }

    .dash-table tbody tr:hover td {
      background: #fafcff;
    }

    /* status badge */
    .status-badge {
      background: #e6f0ff;
      color: #1e4a8a;
      padding: 3px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      border: 1px solid #b8d0f0;
      letter-spacing: 0.2px;
    }

    /* ===== PENCIL BUTTON – BLUE BACKGROUND, WHITE PENCIL ===== */
    .edit-btn {
      background: #2563eb;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
      text-decoration: none;
    }
    .edit-btn:hover {
      background: #1d4ed8;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
    }
    .edit-btn:active {
      transform: scale(0.92);
    }
    .edit-btn:focus-visible {
      outline: 2px solid #1d4ed8;
      outline-offset: 2px;
    }

    /* pencil SVG – white stroke */
    .pencil-svg {
      width: 18px;
      height: 18px;
      display: inline-block;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }
    .edit-btn:hover .pencil-svg {
      stroke: #ffffff;
    }

    /* "You do not have any submitted applications" */
    .no-applications {
      color: #64748b;
      font-size: 14px;
      padding: 14px 14px 10px;
      margin-top: 12px;
      border: 1px solid #dce1e8;
      border-radius: 6px;
      background: #fafcff;
      text-align: left;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px 12px;
      }
      .dashboard-card {
        padding: 16px 12px;
      }
      .dashboard-head h2 {
        font-size: 18px;
      }
      .lang-badge {
        font-size: 12px;
        padding: 4px 14px;
      }
      .dash-table {
        font-size: 12px;
        min-width: 620px;
      }
      .dash-table th,
      .dash-table td {
        padding: 10px 10px;
      }
      .status-badge {
        font-size: 11px;
        padding: 2px 12px;
      }
      .pencil-svg {
        width: 16px;
        height: 16px;
      }
      .edit-btn {
        padding: 5px 8px;
      }
    }

    @media (max-width: 480px) {
      .dashboard-card {
        padding: 12px 8px;
      }
      .dash-table {
        font-size: 11px;
        min-width: 500px;
      }
      .dash-table th,
      .dash-table td {
        padding: 8px 8px;
      }
      .status-badge {
        font-size: 10px;
        padding: 2px 10px;
      }
      .pencil-svg {
        width: 14px;
        height: 14px;
      }
      .edit-btn {
        padding: 4px 6px;
      }
      .no-applications {
        font-size: 13px;
        padding: 12px 10px;
      }
      .saved-applications-label {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-card" role="region" aria-label="Dashboard">

    <!-- HEADER: Dashboard + English -->
    <div class="dashboard-head">
      <h2>Dashboard</h2>
      <span class="lang-badge">English</span>
    </div>

    <!-- "My Saved Applications" – below Dashboard -->
    <div class="saved-applications-label">
      My Saved Applications
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <table class="dash-table" aria-label="My Saved Applications">
        <thead>
          <tr>
            <th>Creation Date</th>
            <th>Form No.</th>
            <th>Form Description</th>
            <th>Expiry Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>25/08/2026</td>
            <td>GST REG-01</td>
            <td>Application for New Registration</td>
            <td>09/09/2026</td>
            <td>
              <span class="status-badge draft">Draft</span>
            </td>
            <td>
              <!-- PENCIL BUTTON – navigates to partb.html -->
              <a href="partb.html" class="edit-btn" aria-label="Edit application - Continue to Part B">
                <svg class="pencil-svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9" />
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                </svg>
                <span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
                  Edit - Continue to Part B
                </span>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- "You do not have any submitted applications" -->
    <div class="no-applications">
      You do not have any submitted applications
    </div>

  </div>

  <script>
    console.log('Dashboard – pencil button now navigates to partb.html');
  </script>

</body>
</html>
